name: Home Plate Build Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret build configuration
        run: cp Configs/Secrets.example.xcconfig Configs/Secrets.xcconfig
      - name: Build iOS simulator target
        run: xcodebuild -quiet -project HomePlate.xcodeproj -scheme HomePlate -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Test native contracts
        run: |
          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e 'd=JSON.parse(STDIN.read)["devices"].values.flatten.find { |x| x["name"].start_with?("iPhone") }; abort "No iPhone simulator available" unless d; puts d["udid"]')
          xcodebuild -quiet -project HomePlate.xcodeproj -scheme HomePlate -destination "platform=iOS Simulator,id=$device_id" -configuration Debug CODE_SIGNING_ALLOWED=NO test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret build configuration
        run: cp Configs/Secrets.example.xcconfig Configs/Secrets.xcconfig
      - name: Build macOS target
        run: xcodebuild -quiet -project HomePlate.xcodeproj -scheme HomePlateMac -destination 'platform=macOS' -configuration Debug CODE_SIGNING_ALLOWED=NO build
